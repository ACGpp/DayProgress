name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run regression checks
        run: ./test.sh

      - name: Build universal app
        run: ./release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayProgress-universal
          path: dist/DayProgress-*.zip
          if-no-files-found: error
